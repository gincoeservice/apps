<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Apps</title>
<link rel="icon" href="data:,">
<style>
  /* ============================================================
     CONFIG — edit the app tiles here. Paste each web app's live
     URL into "url". Leave the icon/gradient/name alone unless you
     want to restyle a tile.
  ============================================================ */
  :root {
    --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-system);
    overflow: hidden;
    background: #F2F2F7;
  }

  /* ============================================================
     WALLPAPER — clean white/grey Apple-style background filling
     the whole viewport behind the phone-width content column.
  ============================================================ */
  .wallpaper {
    position: fixed; inset: 0;
    background: linear-gradient(165deg, #FFFFFF 0%, #F2F2F7 55%, #E5E5EA 100%);
    z-index: 0;
  }

  .stage {
    position: relative; z-index: 1;
    height: 100%;
    max-width: 460px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    color: #1C1C1E;
  }

  /* ============================================================
     LOCK SCREEN
  ============================================================ */
  #lockScreen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px;
    transition: transform 0.55s cubic-bezier(.5,0,.2,1), opacity 0.45s ease;
    z-index: 5;
  }
  #lockScreen.unlocked { transform: translateY(-100%); opacity: 0; pointer-events: none; }

  .passcode-prompt {
    font-size: 15px; font-weight: 600; opacity: 0.85;
    text-align: center;
  }

  .dots { display: flex; gap: 18px; margin: 22px 0 6px; position: relative; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1.5px solid rgba(60,60,67,0.4);
    background: transparent;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .dot.filled { background: #1C1C1E; border-color: #1C1C1E; transform: scale(1.05); }
  .dots.shake { animation: shakeIt 0.42s; }
  @keyframes shakeIt {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }
  .passcode-error {
    height: 18px; font-size: 13px; color: #FF3B30; margin-top: 4px;
    opacity: 0; transition: opacity 0.2s ease;
  }
  .passcode-error.show { opacity: 1; }

  /* Real numeric input sits invisibly over the dots — tapping the dots
     (or just landing on the page) focuses it and brings up the phone's
     own number pad, so no custom on-screen keypad needs to be drawn. */
  .pc-input {
    position: absolute; inset: -14px -18px;
    opacity: 0; border: none; outline: none;
    font-size: 16px; /* avoids iOS auto-zoom on focus */
    background: transparent; color: transparent; caret-color: transparent;
    cursor: default;
  }

  /* ============================================================
     HOME SCREEN
  ============================================================ */
  #homeScreen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease 0.15s;
    pointer-events: none;
  }
  #homeScreen.visible { opacity: 1; pointer-events: auto; }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px 14px;
    padding: 0 22px;
    justify-items: center;
    align-content: center;
    overflow-y: auto;
    max-height: 100%;
  }

  .app-tile {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    text-decoration: none; color: #1C1C1E;
    cursor: pointer;
    background: none; border: none; padding: 0;
    font-family: var(--font-system);
  }
  .app-icon {
    width: 62px; height: 62px;
    border-radius: 16px; /* ~26% squircle approximation */
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 14px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.25);
    transition: transform 0.12s ease;
  }
  .app-tile:active .app-icon { transform: scale(0.90); }
  .app-icon svg { width: 30px; height: 30px; }
  .app-label {
    font-size: 12px; font-weight: 500;
    text-align: center; line-height: 1.2;
    max-width: 78px;
  }

  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>

<div class="wallpaper"></div>

<div class="stage">

  <!-- ============================================================
       LOCK SCREEN
  ============================================================ -->
  <div id="lockScreen">
    <div class="passcode-prompt">Enter Passcode</div>
    <div class="dots" id="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
      <input class="pc-input" id="pcInput" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    </div>
    <div class="passcode-error" id="pcError">Incorrect Passcode</div>
  </div>

  <!-- ============================================================
       HOME SCREEN
  ============================================================ -->
  <div id="homeScreen">
    <div class="app-grid" id="appGrid"></div>
  </div>

</div>

<script>
// ============================================================
// EDIT THIS — paste each web app's live URL below. Nothing else
// needs to change; icons/colours/names are already set up.
// ============================================================
const APPS = [
  {
    name: 'Label Printing',
    url: 'https://script.google.com/macros/s/AKfycbwynPJusRYcEcfv9tMnFpWBTd1ctb_vu-V5DBUZK9JVKsKrRpriSCYkAgXUdXjTfxyI/exec',
    gradient: 'linear-gradient(160deg, #5AC8FA, #007AFF)',
    icon: `<path d="M6 9V4a1 1 0 011-1h10a1 1 0 011 1v5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="9" width="16" height="7" rx="1.5" stroke="#fff" stroke-width="1.8"/><path d="M7 15v5a1 1 0 001 1h8a1 1 0 001-1v-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`,
  },
  {
    name: 'Shelf Label Printing',
    url: 'PASTE_SHELF_LABEL_PRINTING_URL_HERE',
    gradient: 'linear-gradient(160deg, #FFCC00, #FF9500)',
    icon: `<path d="M12.6 3.6l7.8 7.8a2 2 0 010 2.8l-6.2 6.2a2 2 0 01-2.8 0l-7.8-7.8a2 2 0 01-.6-1.4V5.6a2 2 0 012-2h5.6a2 2 0 011.4.6z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.5" fill="#fff"/>`,
  },
  {
    name: 'Barcode Label Printing',
    url: 'PASTE_BARCODE_LABEL_PRINTING_URL_HERE',
    gradient: 'linear-gradient(160deg, #30D5C8, #34C759)',
    icon: `<rect x="3" y="5" width="1.6" height="14" fill="#fff"/><rect x="6" y="5" width="0.9" height="14" fill="#fff"/><rect x="8.3" y="5" width="1.6" height="14" fill="#fff"/><rect x="11.3" y="5" width="0.9" height="14" fill="#fff"/><rect x="13.5" y="5" width="2.2" height="14" fill="#fff"/><rect x="17" y="5" width="0.9" height="14" fill="#fff"/><rect x="19.3" y="5" width="1.6" height="14" fill="#fff"/>`,
  },
  {
    name: 'Order Packing',
    url: 'PASTE_ORDER_PACKING_URL_HERE',
    gradient: 'linear-gradient(160deg, #BF5AF2, #AF52DE)',
    icon: `<path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2L12 3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 7.2L12 11.4l8-4.2M12 11.4V21" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>`,
  },
  {
    name: 'Inventory Syncing',
    url: 'PASTE_INVENTORY_SYNCING_URL_HERE',
    gradient: 'linear-gradient(160deg, #FF6482, #FF3B30)',
    icon: `<path d="M12 3l9 4.5-9 4.5-9-4.5L12 3z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>`,
  }
];

const PASSCODE = '1203';

// ------------------------------------------------------------
// Passcode entry — no on-screen keypad is drawn. A transparent
// numeric input sits over the dots; focusing it brings up the
// device's own number pad (or accepts a physical keyboard), and
// only the 4 dots are ever shown filling in as digits land.
// ------------------------------------------------------------
let entered = '';
const dotsEl   = document.getElementById('dots');
const pcInput  = document.getElementById('pcInput');
const errEl    = document.getElementById('pcError');
const lockEl   = document.getElementById('lockScreen');
const homeEl   = document.getElementById('homeScreen');

function renderDots() {
  const dots = dotsEl.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('filled', i < entered.length));
}

function checkCode() {
  if (entered === PASSCODE) {
    errEl.classList.remove('show');
    try { sessionStorage.setItem('appHubUnlocked', '1'); } catch(e) {}
    unlock();
  } else {
    errEl.classList.add('show');
    dotsEl.classList.add('shake');
    setTimeout(() => {
      dotsEl.classList.remove('shake');
      entered = '';
      pcInput.value = '';
      renderDots();
    }, 420);
  }
}

function unlock() {
  lockEl.classList.add('unlocked');
  homeEl.classList.add('visible');
  entered = '';
  pcInput.value = '';
  renderDots();
}

pcInput.addEventListener('input', () => {
  entered = pcInput.value.replace(/\D/g, '').slice(0, 4);
  pcInput.value = entered;
  renderDots();
  if (entered.length === 4) setTimeout(checkCode, 120);
});

// Focus the hidden input on load and on any tap so the number pad
// is always ready without ever showing custom on-screen keys.
lockEl.addEventListener('click', () => pcInput.focus());
window.addEventListener('load', () => pcInput.focus());

// ------------------------------------------------------------
// Build app grid from APPS config
// ------------------------------------------------------------
function makeTile(app) {
  const btn = document.createElement('a');
  btn.className = 'app-tile';
  btn.href = app.url;
  btn.rel = 'noopener';
  btn.innerHTML =
    '<div class="app-icon" style="background:' + app.gradient + '">' +
      '<svg viewBox="0 0 24 24" fill="none">' + app.icon + '</svg>' +
    '</div>' +
    '<div class="app-label">' + app.name + '</div>';
  return btn;
}

const grid = document.getElementById('appGrid');
APPS.forEach(app => grid.appendChild(makeTile(app)));

// Skip the lock screen if already unlocked earlier this browser session
try {
  if (sessionStorage.getItem('appHubUnlocked') === '1') unlock();
} catch(e) {}
</script>
</body>
</html>
